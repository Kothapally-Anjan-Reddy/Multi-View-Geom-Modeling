<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Models · Reconstruct3D</title>
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#42474c;background:#f2f2f2;accent-color:#13a9d5}*{box-sizing:border-box}body{margin:0;font-size:16px}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}header{background:white;display:flex;align-items:center;gap:28px;padding:22px 2vw;border-bottom:1px solid #e3e3e3}.brand{font-size:24px;font-weight:750;white-space:nowrap}.brand span{color:#13a9d5}.mark{display:inline-grid;place-items:center;width:34px;height:34px;background:#13a9d5;color:white;border-radius:50%;margin-right:8px}#search{flex:1;min-width:120px;border:1px solid #ccc;border-radius:4px;padding:11px 15px}button{border:1px solid #13a9d5;color:#008db8;background:white;padding:10px 16px;border-radius:4px}button:hover{background:#edfaff}button:disabled{opacity:.5;cursor:wait}.navigation{background:white;padding:0 2vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4e4e4}.tab{padding:20px 24px;color:#009fc9;border-bottom:3px solid #13a9d5}#count{font-size:14px;color:#737b80}.filters{background:white;padding:18px 2vw;display:flex;gap:30px;align-items:center;box-shadow:0 2px 4px #0001}.filters label{font-size:12px;color:#767d83;text-transform:uppercase;display:grid;gap:6px}.filters select{color:#008db8;background:white;border:0;min-width:150px;font-size:16px;padding:3px 20px 3px 0}.sort{margin-left:auto}main{padding:24px 2vw}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}.card{background:white;border-radius:4px;overflow:hidden;box-shadow:0 2px 3px #0001,0 8px 22px #00000008;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002}.preview{display:grid;place-items:center;aspect-ratio:16/10;background:#e0e4e7;position:relative;text-decoration:none;color:#667680;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:64px}.caption{position:absolute;bottom:10px;left:10px;background:#17242dcc;color:white;font-size:12px;padding:4px 7px;border-radius:3px}.body{padding:14px}.title-row{display:flex;align-items:center;gap:10px}.title-row a{font-size:16px;font-weight:650;color:#41464a;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.delete{font-size:13px;padding:5px 8px;color:#a43434;border-color:#e5caca}.delete:hover{background:#fff0f0}.stats{font-size:13px;color:#707980;display:flex;justify-content:space-between;gap:8px;margin-top:10px}.badge{color:#946623}.complete{color:#24815e}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:#707980}.notice{font-size:13px;color:#737b80;margin-top:28px}#error{color:#ac2929;margin-bottom:14px}dialog{border:0;border-radius:8px;max-width:460px;width:calc(100% - 32px);padding:28px;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#14202b88}dialog h2{margin-top:0;font-size:22px}dialog p{line-height:1.6;color:#626b72;overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.danger{background:#b93636;color:white;border-color:#b93636}.danger:hover{background:#982b2b}#delete-error{color:#ac2929;font-size:14px}@media(max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{flex-wrap:wrap;gap:14px}#search{order:3;flex-basis:100%}.brand{flex:1}}@media(max-width:520px){.grid{grid-template-columns:1fr}.filters{gap:14px;flex-wrap:wrap}.sort{margin-left:0}main{padding:20px}.navigation,header,.filters{padding-left:20px;padding-right:20px}.tab{padding-left:0}}
</style></head><body>
<header><div class="brand"><span class="mark">◇</span>Reconstruct<span>3D</span></div><input id="search" type="search" placeholder="Search your 3D models" aria-label="Search models"><button id="refresh">Refresh library</button></header>
<div class="navigation"><div class="tab">Models</div><span id="count" role="status">Loading library…</span></div>
<div class="filters"><label>Status<select id="filter"><option value="all">All models</option><option value="complete">Complete</option><option value="progress">In progress</option></select></label><label class="sort">Sort by<select id="sort"><option value="newest">Recently updated</option><option value="name">Name A–Z</option><option value="points">Most points</option></select></label></div>
<main><div id="error" role="alert"></div><div id="projects" class="grid"></div><p class="notice">Your saved reconstructions · Thumbnails show source photographs when available.</p></main>
<dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Permanently delete model?</h2><p id="delete-description"></p><p>This removes all saved reconstruction outputs, including the mesh, point cloud and depth maps. Original source photos are kept. This cannot be undone.</p><div id="delete-error" role="alert"></div><div class="actions"><button id="cancel-delete" autofocus>Cancel</button><button id="confirm-delete" class="danger">Delete permanently</button></div></dialog>
<script>
const grid=document.querySelector('#projects'),error=document.querySelector('#error'),dialog=document.querySelector('#delete-dialog');
let projects=[],signature='',selected=null,deleting=false;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function render(){
 const query=document.querySelector('#search').value.trim().toLowerCase(),filter=document.querySelector('#filter').value,sort=document.querySelector('#sort').value;
 const shown=projects.filter(p=>p.name.toLowerCase().includes(query)&&(filter==='all'||(filter==='complete'?p.state==='Complete':p.state!=='Complete')));
 shown.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='points'?(b.metrics.dense_points||0)-(a.metrics.dense_points||0):b.updated-a.updated);
 document.querySelector('#count').textContent=shown.length+' of '+projects.length+' models';grid.replaceChildren();
 if(!shown.length){grid.append(el('div','empty',projects.length?'No models match your search.':'No saved reconstructions yet. Reconstruct an object to add it here.'));return;}
 for(const p of shown){const card=el('article','card'),preview=el('a','preview'),body=el('div','body'),url='/view?project='+encodeURIComponent(p.id);preview.href=url;preview.setAttribute('aria-label','Open '+p.name);
 if(p.preview){const img=el('img');img.src='/api/file/'+p.preview+'?project='+encodeURIComponent(p.id);img.alt=p.preview_kind+' for '+p.name;img.loading='lazy';preview.append(img,el('span','caption',p.preview_kind));}else preview.append(el('span','placeholder','◇'));
 const row=el('div','title-row'),link=el('a','',p.name);link.href=url;link.title=p.name;const del=el('button','delete','Delete');del.setAttribute('aria-label','Delete '+p.name);del.onclick=()=>{selected=p;document.querySelector('#delete-description').textContent='Delete “'+p.name+'”?';document.querySelector('#delete-error').textContent='';dialog.showModal();};row.append(link,del);
 const stats=el('div','stats');stats.append(el('span','badge'+(p.state==='Complete'?' complete':''),p.state),el('span','',p.metrics.dense_points?new Intl.NumberFormat(undefined,{notation:'compact'}).format(p.metrics.dense_points)+' points':(p.input_images||0)+' photos'));body.append(row,stats);card.append(preview,body);grid.append(card);}
}
async function refresh(){try{const response=await fetch('/api/projects');if(!response.ok)throw Error('Unable to read saved reconstructions.');const data=await response.json();error.textContent='';const next=JSON.stringify(data);if(next!==signature){signature=next;projects=data;render();}}catch(e){error.textContent=e.message;}}
document.querySelector('#cancel-delete').onclick=()=>dialog.close();dialog.addEventListener('cancel',e=>{if(deleting)e.preventDefault()});
document.querySelector('#confirm-delete').onclick=async()=>{if(!selected||deleting)return;deleting=true;const id=selected.id;document.querySelector('#confirm-delete').disabled=true;document.querySelector('#cancel-delete').disabled=true;try{const r=await fetch('/api/projects/'+encodeURIComponent(id),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:id})});const data=await r.json();if(!r.ok)throw Error(data.error||'Deletion failed.');dialog.close();projects=projects.filter(p=>p.id!==id);signature='';render();await refresh();}catch(e){document.querySelector('#delete-error').textContent=e.message;}finally{deleting=false;document.querySelector('#confirm-delete').disabled=false;document.querySelector('#cancel-delete').disabled=false;}};
document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;document.querySelector('#sort').onchange=render;document.querySelector('#refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden&&!dialog.open)refresh()},10000);
</script></body></html>
